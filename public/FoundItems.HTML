<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Found Item</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
        }

        header {
            background: #43a047;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .form-container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.1);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #43a047;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #2e7d32;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>🟢 Report Found Item</h1>
</header>

<div class="form-container">

    <form id="foundItemForm">

        <label>Item Name</label>
        <input type="text" id="itemName" required>

        <label>Description</label>
        <textarea id="description" required></textarea>

        <label>Location Found</label>
        <input type="text" id="location" required>

        <label>Date Found</label>
        <input type="date" id="date" required>

        <label>Photo of Found Item</label>
        <input type="file" id="photo" accept="image/*" required>

        <label>Contact</label>
        <input type="text" id="contact" required>

        <button type="submit">Report Found Item</button>

    </form>

    <div id="message"></div>

</div>

<script>
document.getElementById("foundItemForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const formData = new FormData();

    formData.append("type", "found");
    formData.append("itemName", document.getElementById("itemName").value);
    formData.append("description", document.getElementById("description").value);
    formData.append("location", document.getElementById("location").value);
    formData.append("date", document.getElementById("date").value);
    formData.append("contact", document.getElementById("contact").value);

    const photo = document.getElementById("photo").files[0];

    if (!photo) {
        document.getElementById("message").textContent =
            "❌ Photo is required for found items.";
        return;
    }

    formData.append("photo", photo);

    try {

        const response = await fetch("http://localhost:5001/api/items", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (response.ok) {

            document.getElementById("message").textContent =
                "✅ Found item reported successfully!";

            document.getElementById("foundItemForm").reset();

        } else {

            document.getElementById("message").textContent =
                "❌ Error: " + data.error;

        }

    } catch (error) {

        document.getElementById("message").textContent =
            "❌ Could not connect to the server.";

        console.error(error);

    }

});
</script>

</body>
</html>
