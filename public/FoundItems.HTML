```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Found Item</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
        }

        header {
            background: #43a047;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .form-container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.1);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #43a047;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #2e7d32;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
        }

        .match {
            color: #2e7d32;
        }

        .waiting {
            color: #ef6c00;
        }

        .error {
            color: #c62828;
        }
    </style>
</head>

<body>

<header>
    <h1>🟢 Report Found Item</h1>
</header>

<div class="form-container">

    <form id="foundItemForm">

        <label>Item Name</label>
        <input type="text" id="itemName" required>

        <label>Description / Specifications</label>
        <textarea
            id="description"
            placeholder="Add colour, model, marks, case, scratches, stickers, etc."
            required
        ></textarea>

        <label>Location Found</label>
        <input type="text" id="location" required>

        <label>Date Found</label>
        <input type="date" id="date" required>

        <label>Photo of Found Item</label>
        <input type="file" id="photo" accept="image/*" required>

        <label>Contact</label>
        <input type="text" id="contact" required>

        <button type="submit">
            Report Found Item
        </button>

    </form>

    <div id="message"></div>

</div>

<script>

const API_URL =
    "https://college-lost-found-61k7.onrender.com";


document
    .getElementById("foundItemForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const message =
                document.getElementById("message");

            const formData =
                new FormData();


            // -----------------------------
            // FORM DATA
            // -----------------------------

            formData.append(
                "type",
                "found"
            );

            formData.append(
                "itemName",
                document
                    .getElementById("itemName")
                    .value
            );

            formData.append(
                "description",
                document
                    .getElementById("description")
                    .value
            );

            formData.append(
                "location",
                document
                    .getElementById("location")
                    .value
            );

            formData.append(
                "date",
                document
                    .getElementById("date")
                    .value
            );

            formData.append(
                "contact",
                document
                    .getElementById("contact")
                    .value
            );


            // -----------------------------
            // PHOTO
            // -----------------------------

            const photo =
                document
                    .getElementById("photo")
                    .files[0];


            if (!photo) {

                message.className = "error";

                message.textContent =
                    "❌ Photo is required for found items.";

                return;
            }


            formData.append(
                "photo",
                photo
            );


            try {

                message.className = "";

                message.textContent =
                    "🔍 Checking for matching lost items...";


                // -----------------------------
                // SEND TO SERVER
                // -----------------------------

                const response =
                    await fetch(
                        `${API_URL}/api/items`,
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json();


                // -----------------------------
                // RESPONSE
                // -----------------------------

                if (response.ok) {

                    if (data.matched) {

                        message.className =
                            "match";

                        message.innerHTML =
                            `
                            ✅ <strong>Possible match found!</strong><br>
                            Match score: ${data.matchScore}%<br>
                            The system found a matching lost-item report.
                            `;

                    } else {

                        message.className =
                            "waiting";

                        message.innerHTML =
                            `
                            ⏳ <strong>No strong match yet.</strong><br>
                            Your found item has been saved.<br>
                            It will remain waiting for a matching lost-item report.
                            `;

                    }


                    document
                        .getElementById("foundItemForm")
                        .reset();


                } else {

                    message.className =
                        "error";

                    message.textContent =
                        "❌ Error: " +
                        (
                            data.error ||
                            "Something went wrong."
                        );

                }


            } catch (error) {

                message.className =
                    "error";

                message.textContent =
                    "❌ Could not connect to the server.";

                console.error(
                    "Error:",
                    error
                );

            }

        }
    );

</script>

</body>
</html>
