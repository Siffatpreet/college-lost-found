<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Lost & Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        nav {
            background: #111;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            min-height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .hero h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            color: #555;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 15px;
        }

        .button {
            padding: 14px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .lost {
            background: #222;
            color: white;
        }

        .found {
            background: #ddd;
            color: #111;
        }
    </style>
</head>

<body>

    <nav>
        <h2>College Lost & Found</h2>

        <div>
            <a href="/">Home</a>
            <a href="/lost">Report Lost</a>
            <a href="/found">Report Found</a>
        </div>
    </nav>

    <section class="hero">

        <h1>College Lost & Found</h1>

        <p>
            Lost something? Report it here.
            Found something? Submit it here.
            Our system will automatically check submitted details
            for possible matches.
        </p>

        <div class="buttons">

            <a href="/lost" class="button lost">
                I Lost Something
            </a>

            <a href="/found" class="button found">
                I Found Something
            </a>

        </div>

    </section>

</body>
</html>
